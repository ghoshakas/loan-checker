server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Uploads: the backend caps one application at 15 MB in total.
    client_max_body_size 20m;

    # API -> backend container. The trailing slash strips the /api prefix,
    # so /api/auth/login reaches the backend as /auth/login.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Screening calls Gemini (with retries), which can take a while.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths fall back to index.html.
    location / {
        try_files $uri /index.html;
    }
}
